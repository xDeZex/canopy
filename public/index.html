<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canopy</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- Monaco's AMD loader, a classic script so window.require exists before
       main.js (a module script, deferred by default) runs. CDN load, no
       build step, matching the README's approach and the version validated
       in prototype/ui-layout. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
</head>
<body>
  <div id="app">
    <div class="tabs-wrapper" id="tabs-wrapper">
      <div class="tabs" id="tabs" role="tablist" aria-label="Worktrees"></div>
    </div>
    <div class="body" id="body">
      <nav class="rail" id="rail" aria-label="Files">
        <p class="empty rail__message">Loading files…</p>
      </nav>
      <div class="rail-divider" id="rail-divider" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="File panel width" aria-controls="rail"
           aria-valuemin="160" aria-valuemax="560" aria-valuenow="220"
           title="Drag or use Left / Right arrow keys to resize the file panel"></div>
      <div class="workspace-content">
        <div class="viewer__toolbar" id="toolbar" hidden></div>
        <main class="main" id="main">
          <p class="empty">Loading worktrees…</p>
        </main>
      </div>
    </div>
  </div>
  <div class="shortcut-help" id="shortcut-help" role="dialog" aria-label="Keyboard shortcuts" hidden>
    <div class="shortcut-help__panel">
      <h2 class="shortcut-help__title">Keyboard shortcuts</h2>
      <dl class="shortcut-help__list">
        <dt><kbd>j</kbd> <kbd>l</kbd></dt><dd>Previous / next change</dd>
        <dt><kbd>s</kbd> <kbd>f</kbd></dt><dd>Previous / next changed file</dd>
        <dt><kbd>e</kbd> <kbd>d</kbd></dt><dd>Scroll up / down 10 lines</dd>
        <dt><kbd>1</kbd>–<kbd>9</kbd></dt><dd>Switch to worktree tab</dd>
        <dt><kbd>?</kbd></dt><dd>Show / hide this help</dd>
        <dt><kbd>Esc</kbd></dt><dd>Close help and menus</dd>
      </dl>
    </div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
